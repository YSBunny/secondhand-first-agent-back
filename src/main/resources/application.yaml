spring:
  application:
    name: second-hand-first
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/second-hand-first;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  auth:
    jwt-secret: ${JWT_SECRET:second-hand-first-local-secret-key-change-me}
    access-token-seconds: 3600
    refresh-token-seconds: 1209600
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
